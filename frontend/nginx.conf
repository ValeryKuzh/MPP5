# Статика SPA + обратный прокси к репликам шлюза (HTTP и WebSocket).
# resolver + переменная заставляют nginx периодически перечитывать DNS Docker,
# поэтому запросы распределяются по всем репликам gateway (round-robin DNS).
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json;

  location /graphql {
    set $gateway http://gateway:4000;
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_next_upstream error timeout http_502 http_503;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
