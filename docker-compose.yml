name: devpulse

x-backend: &backend
  build: .
  image: devpulse-backend:latest
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

x-env: &env
  REDIS_URL: redis://redis:6379
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: ${TRACE_SAMPLE_RATIO:-1.0}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  # ---------------- Хранилища ----------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpulse}
      POSTGRES_DB: devpulse
    command: >
      postgres -c shared_buffers=256MB -c work_mem=16MB -c max_connections=200
               -c random_page_cost=1.1 -c effective_cache_size=768MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devpulse']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes: [redisdata:/data]
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------- Подграфы (GraphQL API) ----------------
  repos:
    <<: *backend
    command: ['node', '-r', '@devpulse/common/tracing', 'services/repos/src/index.js']
    environment:
      <<: *env
      PORT: 4001
      OTEL_SERVICE_NAME: repos
      DATABASE_URL: postgres://devpulse:${POSTGRES_PASSWORD:-devpulse}@postgres:5432/repos
    deploy: { replicas: '${SUBGRAPH_REPLICAS:-1}' }
    healthcheck: &hc
      test: ['CMD-SHELL', 'wget -qO- http://localhost:$$PORT/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  news:
    <<: *backend
    command: ['node', '-r', '@devpulse/common/tracing', 'services/news/src/index.js']
    environment:
      <<: *env
      PORT: 4002
      OTEL_SERVICE_NAME: news
      DATABASE_URL: postgres://devpulse:${POSTGRES_PASSWORD:-devpulse}@postgres:5432/news
    deploy: { replicas: '${SUBGRAPH_REPLICAS:-1}' }
    healthcheck: *hc

  packages:
    <<: *backend
    command: ['node', '-r', '@devpulse/common/tracing', 'services/packages/src/index.js']
    environment:
      <<: *env
      PORT: 4003
      OTEL_SERVICE_NAME: packages
      DATABASE_URL: postgres://devpulse:${POSTGRES_PASSWORD:-devpulse}@postgres:5432/packages
    deploy: { replicas: '${SUBGRAPH_REPLICAS:-1}' }
    healthcheck: *hc

  # ---------------- Воркеры сбора данных ----------------
  repos-worker:
    <<: *backend
    command: ['node', '-r', '@devpulse/common/tracing', 'services/repos/src/worker.js']
    environment:
      <<: *env
      OTEL_SERVICE_NAME: repos-worker
      DATABASE_URL: postgres://devpulse:${POSTGRES_PASSWORD:-devpulse}@postgres:5432/repos
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_TARGET: ${GITHUB_TARGET:-12000}
      SYNC_CRON: ${SYNC_CRON_REPOS:-0 3 * * *}
      AUTO_SYNC_ON_START: ${AUTO_SYNC_ON_START:-true}
      METRICS_PORT: 9100

  news-worker:
    <<: *backend
    command: ['node', '-r', '@devpulse/common/tracing', 'services/news/src/worker.js']
    environment:
      <<: *env
      OTEL_SERVICE_NAME: news-worker
      DATABASE_URL: postgres://devpulse:${POSTGRES_PASSWORD:-devpulse}@postgres:5432/news
      HN_COMMENT_STORIES: ${HN_COMMENT_STORIES:-300}
      SYNC_CRON: ${SYNC_CRON_NEWS:-0 */6 * * *}
      AUTO_SYNC_ON_START: ${AUTO_SYNC_ON_START:-true}
      METRICS_PORT: 9100

  packages-worker:
    <<: *backend
    command: ['node', '-r', '@devpulse/common/tracing', 'services/packages/src/worker.js']
    environment:
      <<: *env
      OTEL_SERVICE_NAME: packages-worker
      DATABASE_URL: postgres://devpulse:${POSTGRES_PASSWORD:-devpulse}@postgres:5432/packages
      NPM_TARGET: ${NPM_TARGET:-12000}
      NPM_DEPS_LIMIT: ${NPM_DEPS_LIMIT:-3000}
      SYNC_CRON: ${SYNC_CRON_PACKAGES:-0 4 * * *}
      AUTO_SYNC_ON_START: ${AUTO_SYNC_ON_START:-true}
      METRICS_PORT: 9100

  # ---------------- Федеративный шлюз ----------------
  gateway:
    <<: *backend
    command: ['node', '-r', '@devpulse/common/tracing', 'gateway/src/index.js']
    depends_on:
      redis: { condition: service_healthy }
      repos: { condition: service_healthy }
      news: { condition: service_healthy }
      packages: { condition: service_healthy }
    environment:
      <<: *env
      PORT: 4000
      OTEL_SERVICE_NAME: gateway
      REPOS_URL: http://repos:4001/graphql
      NEWS_URL: http://news:4002/graphql
      PACKAGES_URL: http://packages:4003/graphql
      MAX_QUERY_DEPTH: ${MAX_QUERY_DEPTH:-12}
      MAX_QUERY_COMPLEXITY: ${MAX_QUERY_COMPLEXITY:-5000}
      COST_BUDGET_PER_MIN: ${COST_BUDGET_PER_MIN:-100000}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-600}
      MAX_INFLIGHT_REQUESTS: ${MAX_INFLIGHT_REQUESTS:-200}
    deploy: { replicas: '${GATEWAY_REPLICAS:-2}' }
    healthcheck: *hc

  # ---------------- Frontend (nginx: статика + балансировка шлюзов) ----------------
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      gateway: { condition: service_healthy }
    ports: ['${FRONTEND_PORT:-8080}:80']

  # ---------------- Наблюдаемость ----------------
  jaeger:
    image: jaegertracing/jaeger:2.5.0
    restart: unless-stopped
    ports: ['16686:16686', '4318:4318']

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=7d']
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    ports: ['9090:9090']

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/devpulse.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['3000:3000']

volumes:
  pgdata:
  redisdata:
